
name: CI-CD - Application IA DevOps V2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer les tests
        run: python -m pytest test_app.py -v

      - name: Construire image Docker
        run: docker build -t iris-ai-devops-v2:v1 .

      - name: Connexion a Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publier image Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag iris-ai-devops-v2:v1 aymanechadni/iris-ai-devops-v2:latest
          docker push aymanechadni/iris-ai-devops-v2:latest
